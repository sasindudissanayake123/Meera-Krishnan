<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
    </link>
</head>

<body>

    <nav>
        <img src="https://static.vecteezy.com/system/resources/thumbnails/008/991/813/small/elegant-sweet-cake-logo-for-any-business-especially-for-cakery-bakery-cake-shop-cafe-etc-vector.jpg"
            width="200px">

        <button onclick="document.location='contact.html'">Contact Us</button>
        <button onclick="document.location='cake.html'">Cakes</button>
        <button onclick="document.location='about.html'">About</button>
        <button onclick="document.location='index.html'">Home</button>
    </nav>


        <section class="contact-section">

            <!-- Left Side -->
            <div class="contact-info">
                <h1>How can we help you?</h1>

                <div class="info-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <h3>Head Office :</h3>
                        <p>No. 08, homagama</p>
                    </div>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h3>Telephone :</h3>
                        <p>+94783030455</p>
                    </div>
                </div>

                <div class="info-box">
                    <i class="fa-regular fa-envelope"></i>
                    <div>
                        <h3>Email :</h3>
                        <p>sasindu.manethra@gmail.com</p>
                    </div>
                </div>

            </div>

            <!-- Right Side -->
            <div class="contact-form">
                <form>
                    <div class="row">
                        <div class="input-group">
                            <label>First Name *</label>
                            <input type="text" placeholder="First Name">
                        </div>

                        <div class="input-group">
                            <label>Last Name *</label>
                            <input type="text" placeholder="Last Name">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email Address *</label>
                        <input type="email" placeholder="Email Address">
                    </div>

                    <div class="input-group">
                        <label>Mobile Number *</label>
                        <input type="text" placeholder="+94 Phone Number">
                    </div>

                    <div class="input-group">
                        <label>Your Message</label>
                        <textarea placeholder="Start Writing..."></textarea>
                    </div>

                    <button type="submit">Submit</button>
                </form>
            </div>

        </section>

</body>

</html>
